    <script>
        function downloadFile() {
            let data = './PSO_ABS1000.epin';
            let blob = new Blob([data], { type: 'text/plain' });
            let url = window.URL.createObjectURL(blob);

            let a = document.createElement('a');
            a.href = url;
            a.download = 'PSO_ABS1000.epin';
            a.click();
        }
    </script>
    <script>
        function downloadEvoPanel() {
            const fileUrl = "https://github.com/NCNULab114Hua/OnlineVisTool/releases/download/v1.0.0/Evo-Panel.zip";
            const fileName = "Evo-Panel.zip";
            const link = document.createElement("a");
            link.href = fileUrl;
            link.download = fileName;
            link.click();
        }
    </script>
